name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - run: sudo apt-get update && sudo apt-get install -y zsh shellcheck gh jq
      - run: go mod tidy -diff
      - run: go test -count=1 ./...
        env:
          GOTOOLCHAIN: local
      - if: matrix.go == '1.27.x'
        run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Offline acceptance suite
        if: matrix.go == '1.27.x'
        timeout-minutes: 15
        run: bash scripts/test-offline.sh
        env:
          GH_AUTOPROFILE_TEST_GH: /usr/bin/gh
      - if: matrix.go == '1.27.x'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - if: matrix.go == '1.27.x'
        run: shellcheck --severity=warning scripts/*.sh
      - if: matrix.go == '1.27.x'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - run: go vet ./...
      # The rest of the suite drives POSIX shells; Windows behavior lives in
      # tests named for it.
      - run: go test -count=1 -run Windows ./...
      - run: go build ./...

  release-snapshot:
    needs: [test, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.55.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "v2.19.0"
          args: release --snapshot --clean
